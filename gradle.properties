# === JVM Configuration ===
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# === Gradle Daemon ===
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# === AndroidX ===
android.useAndroidX=true
android.enableJetifier=false

# === Kotlin ===
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m

# === Android Build Optimization ===
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# === shiroikuma-kxkb fork versioning (see app/build.gradle.kts + build-apk skill) ===
# VERSION_NAME / VERSION_CODE track upstream (urikdev/Urik). BUILD_NUMBER is our fork
# increment, bumped on every build, reset to 1 on each new upstream version.
# Fork versionName = "<VERSION_NAME>+<BUILD_NUMBER>";
# versionCode = VERSION_CODE * 10000 + BUILD_NUMBER   (Urik 64 -> 640000 + N).
VERSION_NAME=0.23.1
VERSION_CODE=64
BUILD_NUMBER=313
# Installed app id (side-by-side); code namespace kept = upstream for rebase-ability.
APP_ID=shiroikuma.kxkb
APP_NAMESPACE=com.urik.keyboard